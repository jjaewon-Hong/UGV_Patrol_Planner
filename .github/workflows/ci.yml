name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (ROS 2 Jazzy + package + C++ core)
        run: docker build -t ugv-patrol .
      - name: Run all tests (Python, C++, C++ vs Python, scenarios S1~S5)
        run: docker run --rm ugv-patrol
